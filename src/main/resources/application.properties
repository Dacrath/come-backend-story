spring.application.name=come-backend-story

# H2 Database (in-memory - perfect for starting)
spring.datasource.url=jdbc:h2:mem:tsheetsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Show SQL (helpful during development)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Auto-create/update tables based on your entities
spring.jpa.hibernate.ddl-auto=update

# Optional: H2 console (access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
